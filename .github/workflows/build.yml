name: Build Ktuyome

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib grub-pc-bin xorriso mtools qemu-system-x86

      - name: Build
        run: make clean && make

      - name: Smoke test (QEMU)
        run: |
          qemu-img create -f raw disk.img 64M
          timeout 20s qemu-system-i386 -m 256 -cdrom ktuyome.iso -hda disk.img -boot d -vga std -display none -netdev user,id=net0 -device e1000,netdev=net0 || true

      - name: Upload ISO artifact (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: ktuyome-${{ github.ref_name }}
          path: ktuyome.iso

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ktuyome.iso
          generate_release_notes: true